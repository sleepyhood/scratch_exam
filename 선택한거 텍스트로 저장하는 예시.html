<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>선택 항목 텍스트 파일로 저장</title>
</head>
<body>
  <h3>저장할 항목을 선택하세요:</h3>
  <label><input type="checkbox" class="item" value="사과"> 사과</label><br />
  <label><input type="checkbox" class="item" value="바나나"> 바나나</label><br />
  <label><input type="checkbox" class="item" value="오렌지"> 오렌지</label><br />
  <label><input type="checkbox" class="item" value="포도"> 포도</label><br />

  <button id="saveBtn">선택한 항목 저장</button>

  <script>
    document.getElementById('saveBtn').addEventListener('click', () => {
      // 선택된 체크박스들 가져오기
      const selected = Array.from(document.querySelectorAll('.item:checked'));
      if (selected.length === 0) {
        alert('항목을 하나 이상 선택하세요!');
        return;
      }

      // 선택된 항목들의 값(text)만 추출
      const lines = selected.map(input => input.value);

      // 텍스트 데이터 생성
      const text = lines.join('\n');

      // Blob 객체로 파일 생성
      const blob = new Blob([text], { type: 'text/plain' });

      // 다운로드용 임시 링크 생성
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'selected_items.txt';  // 저장될 파일명
      document.body.appendChild(a);
      a.click();

      // 링크 제거 및 URL 해제
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    });
  </script>
</body>
</html>
